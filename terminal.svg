<svg xml:space="preserve" width="860" height="500" viewBox="0 0 860 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop shadow for the terminal window -->
    <filter id="shadow" x="-20" y="-10" width="900" height="540" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Gradient for Brushed Silver Aluminum Lid -->
    <linearGradient id="silver-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="25%" stop-color="#e3e3e8"/>
      <stop offset="50%" stop-color="#c8c8cf"/>
      <stop offset="75%" stop-color="#e3e3e8"/>
      <stop offset="100%" stop-color="#b8b8c0"/>
    </linearGradient>
    
    <!-- Gradient for header background -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
  </defs>

  <style>
    .terminal {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .window-title {
      fill: #7982a9;
      font-size: 12px;
      text-anchor: middle;
      font-weight: 500;
    }
    .prompt-user { fill: #7aa2f7; font-weight: bold; }
    .prompt-host { fill: #bb9af3; font-weight: bold; }
    .prompt-arrow { fill: #9ece6a; }
    .text-normal { fill: #a9b1d6; }
    .text-dim { fill: #565f89; }
    .text-key { fill: #7dcfff; font-weight: bold; }
    .text-value { fill: #c0caf5; }
    .cursor {
      fill: #c0caf5;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Window Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Terminal Background -->
    <rect x="20" y="15" width="820" height="460" rx="12" fill="#1a1b26" stroke="#414868" stroke-width="1.5"/>
    
    <!-- Window Header (macOS Terminal Title Bar) -->
    <path d="M20 27C20 20.3726 25.3726 15 32 15H828C834.627 15 840 20.3726 840 27V48H20V27Z" fill="url(#header-grad)"/>
    <!-- Window Divider line -->
    <line x1="20" y1="48" x2="840" y2="48" stroke="#24283b" stroke-width="1"/>

    <!-- macOS Window Buttons -->
    <!-- Red (Close) -->
    <circle cx="40" cy="31" r="6" fill="#f7768e"/>
    <!-- Yellow (Minimize) -->
    <circle cx="60" cy="31" r="6" fill="#e0af68"/>
    <!-- Green (Maximize) -->
    <circle cx="80" cy="31" r="6" fill="#9ece6a"/>

    <!-- Window Title -->
    <text x="430" y="35" class="window-title">krishna@macbook-pro: ~ (zsh)</text>

    <!-- Terminal Content Area -->
    <g class="terminal" transform="translate(35, 75)">
      <!-- Line 1: Command prompt & execution -->
      <text x="0" y="0" xml:space="preserve"><tspan class="prompt-user">krishna</tspan><tspan class="text-dim">@</tspan><tspan class="prompt-host">macbook-pro</tspan> <tspan class="text-normal">~ %</tspan> <tspan class="text-value">neofetch</tspan></text>

      <!-- Vector Silver MacBook Lid (Left side, aligned to center vertically) -->
      <g class="macbook-lid" transform="translate(15, 35)">
        <!-- Metallic Silver Lid Body -->
        <rect x="10" y="20" width="220" height="140" rx="12" fill="url(#silver-metallic)" stroke="#a1a1a8" stroke-width="1.5"/>
        
        <!-- Matte Silver Lid Edge Shadow (for depth) -->
        <rect x="11" y="21" width="218" height="138" rx="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
        
        <!-- Official Polished Black Apple Logo (Centered) -->
        <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282" fill="#161617" transform="translate(101, 70) scale(2.4)"/>
        
        <!-- Black Laptop Display Hinge at the bottom -->
        <rect x="30" y="160" width="180" height="6" rx="2" fill="#1b1c22"/>
        
        <!-- Shadow beneath the laptop hinge -->
        <rect x="15" y="164" width="210" height="3" rx="1.5" fill="#0c0d12" opacity="0.6"/>
      </g>

      <!-- System Stats Info Panel (Right side) -->
      <g transform="translate(285, 25)">
        <!-- Header / Prompt Info -->
        <text x="0" y="0" xml:space="preserve"><tspan class="prompt-user" font-size="14" font-weight="bold">krishna</tspan><tspan class="text-dim" font-size="14">@</tspan><tspan class="prompt-host" font-size="14" font-weight="bold">macbook-pro</tspan></text>
        <!-- Divider -->
        <text x="0" y="15" class="text-dim" xml:space="preserve">-----------------------------------</text>
        
        <!-- Profile System Spec Rows -->
        <text x="0" y="35" xml:space="preserve"><tspan class="text-key">OS</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">macOS Sequoia (B.Tech CSE Student)</tspan></text>
        <text x="0" y="55" xml:space="preserve"><tspan class="text-key">Host</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">Krishna Verma</tspan></text>
        <text x="0" y="75" xml:space="preserve"><tspan class="text-key">Kernel</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">AI/ML, Deep Learning &amp; Web Dev</tspan></text>
        <text x="0" y="95" xml:space="preserve"><tspan class="text-key">Uptime</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">Born 2004 (21 Years coding &amp; living)</tspan></text>
        <text x="0" y="115" xml:space="preserve"><tspan class="text-key">Shell</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">zsh (Passionate &amp; Eager to Collaborate)</tspan></text>
        <text x="0" y="135" xml:space="preserve"><tspan class="text-key">IDE</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">VS Code &amp; Antigravity IDE</tspan></text>
        <text x="0" y="155" xml:space="preserve"><tspan class="text-key">Status</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">Building the future with AI 🚀</tspan></text>
        <text x="0" y="175" xml:space="preserve"><tspan class="text-key">Contact</tspan><tspan class="text-dim">: </tspan><tspan class="text-value">krishnaverma.0227@gmail.com</tspan></text>
        
        <!-- Visual Terminal Color Swatches -->
        <g transform="translate(0, 195)">
          <rect x="0" y="0" width="20" height="15" fill="#f7768e" rx="2"/>
          <rect x="25" y="0" width="20" height="15" fill="#9ece6a" rx="2"/>
          <rect x="50" y="0" width="20" height="15" fill="#e0af68" rx="2"/>
          <rect x="75" y="0" width="20" height="15" fill="#7aa2f7" rx="2"/>
          <rect x="100" y="0" width="20" height="15" fill="#bb9af3" rx="2"/>
          <rect x="125" y="0" width="20" height="15" fill="#7dcfff" rx="2"/>
          <rect x="150" y="0" width="20" height="15" fill="#a9b1d6" rx="2"/>
        </g>
      </g>

      <!-- JSON Details Block (cat skills.json - balanced gap) -->
      <g transform="translate(0, 280)">
        <text x="0" y="0" xml:space="preserve"><tspan class="prompt-user">krishna</tspan><tspan class="text-dim">@</tspan><tspan class="prompt-host">macbook-pro</tspan> <tspan class="text-normal">~ %</tspan> <tspan class="text-value">cat skills.json</tspan></text>
        <text x="0" y="20" class="text-dim" xml:space="preserve">{</text>
        <text x="20" y="38" xml:space="preserve"><tspan class="text-key">"languages"</tspan><tspan class="text-dim">: [</tspan><tspan class="text-value">"JavaScript"</tspan><tspan class="text-dim">, </tspan><tspan class="text-value">"Python"</tspan><tspan class="text-dim">, </tspan><tspan class="text-value">"C++"</tspan><tspan class="text-dim">, </tspan><tspan class="text-value">"C"</tspan><tspan class="text-dim">],</tspan></text>
        <text x="20" y="56" xml:space="preserve"><tspan class="text-key">"technologies"</tspan><tspan class="text-dim">: [</tspan><tspan class="text-value">"React"</tspan><tspan class="text-dim">, </tspan><tspan class="text-value">"Node.js"</tspan><tspan class="text-dim">, </tspan><tspan class="text-value">"TensorFlow"</tspan><tspan class="text-dim">, </tspan><tspan class="text-value">"OpenCV"</tspan><tspan class="text-dim">]</tspan></text>
        <text x="0" y="74" class="text-dim" xml:space="preserve">}</text>
      </g>
      
      <!-- Blinking Terminal Prompt (balanced bottom padding) -->
      <g transform="translate(0, 375)">
        <text x="0" y="0" xml:space="preserve"><tspan class="prompt-user">krishna</tspan><tspan class="text-dim">@</tspan><tspan class="prompt-host">macbook-pro</tspan> <tspan class="text-normal">~ % </tspan><tspan class="cursor">█</tspan></text>
      </g>
    </g>
  </g>
</svg>
